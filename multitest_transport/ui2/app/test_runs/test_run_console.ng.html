<div class="options" [class.is-omnilab]="isOmnilabBased">
  <mat-form-field appearance="outline">
    <mat-label>Invocation</mat-label>
    <mat-select [(ngModel)]="selectedAttempt"
                (selectionChange)="onInvocationChange()">
      <mat-option *ngFor="let invocation of invocations" [value]="invocation">
        {{invocation.attempt_id}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div *ngIf="!isOmnilabBased">
    <mat-form-field appearance="outline">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="selectedType"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let type of LOG_TYPES | keyvalue" [value]="type.value">
          {{type.key}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="isOmnilabBased">
    <mat-form-field appearance="outline">
      <mat-label>Log Source</mat-label>
      <mat-select [(ngModel)]="selectedSourceType"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let type of SOURCE_TYPE" [value]="type">
          {{type}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" *ngIf="selectedSourceType === 'Tradefed' && tfLogPaths.length > 1">
      <mat-label>Tradefed Invocations</mat-label>
      <mat-select [(ngModel)]="selectedTfLogPathAttemptId"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let logPath of tfLogPaths" [value]="logPath.key">
          {{logPath.key}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" *ngIf="selectedSourceType === 'Tradefed'">
      <mat-label>Tradefed Log Type</mat-label>
      <mat-select [(ngModel)]="selectedTfLogType"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let type of TF_LOG_TYPES | keyvalue" [value]="type.value">
          {{type.key}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" *ngIf="selectedSourceType === 'Mobly'">
      <mat-label>Mobly Log Directory</mat-label>
      <mat-select [(ngModel)]="selectedNonTradefedLogDirName"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let dirName of nonTradefedLogDirNames" [value]="dirName">
          {{dirName}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" *ngIf="selectedSourceType === 'Mobly'">
      <mat-label>Mobly Log Type</mat-label>
      <mat-select [(ngModel)]="selectedMoblyLogType"
                  (selectionChange)="clearConsole(); resetPolling()">
        <mat-option *ngFor="let type of MOBLY_LOG_TYPES | keyvalue" [value]="type.value">
          {{type.key}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <span fxFlex></span>

  <a mat-stroked-button color="accent" [href]="getLogUrl()" target="_blank" *ngIf="output.length">
    Full Log
  </a>
</div>

<div class="output" #outputContainer>
  <pre *ngFor="let line of output">{{line}}</pre>
  <pre class="empty" *ngIf="!output.length">
    <ng-container *ngIf="initialized; else loading">No logs found.</ng-container>
    <ng-template #loading>Loading...</ng-template>
  </pre>
</div>
