<mat-spinner class="loading-spinner" color="accent" *ngIf="isLoading && !(preferenceService?.useLabConsoleUISubject$ | async)"></mat-spinner>

<!--
  In Lab Console mode (the new UI mode, NOT the Legacy UI mode): the page header lives in the app header slot (see
  HeaderSlotService) as a breadcrumb, so that the embedded page gets the full
  height. The <div class="header"> below is only rendered otherwise.
-->
<!--
  Below ng-template content is rendered in the app header slot, NOT in the page content.
-->
<ng-template #headerSlotContent>
  <div class="header-slot-content">
    <button
      mat-icon-button
      class="back-button"
      (click)="back()"
      id="back-button"
      matTooltip="Return"
      aria-label="Return"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <a class="header-crumb" routerLink="/devices" queryParamsHandling="preserve">Devices</a>
    <mat-icon class="header-crumb-separator">chevron_right</mat-icon>
    <mat-select
      class="entity-switcher"
      panelClass="entity-switcher-panel"
      [panelWidth]="null"
      placeholder="Device"
      aria-label="Device"
      [(ngModel)]="id"
      (selectionChange)="load($event.value, true)"
      (click)="startDeviceNavigationHats()"
    >
      <mat-option *ngFor="let deviceSerial of deviceSerialsWithDisplay" [value]="deviceSerial.serial">
        {{ deviceSerial.serialForDisplay }}
      </mat-option>
    </mat-select>
  </div>
</ng-template>

<!--
  Below div is rendered in the page content, and it is ONLY rendered when the header is NOT in the app header slot.
-->
<div class="header" fxLayout="row" fxLayoutAlign="space-between center" *ngIf="!isHeaderInAppHeaderSlot">
  <div class="header-left" fxLayout="row" fxLayoutAlign="start center">
    <button
      *ngIf="!isModalMode"
      mat-icon-button
      class="back-button"
      (click)="back()"
      #backButton
      id="back-button"
      matTooltip="Return"
      aria-label="Return"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Device Details</h1>
    <mat-form-field fxFlex="300px" appearance="outline" class="mat-select-filter" subscriptSizing="dynamic" style="margin-left: 20px;">
      <mat-select
        placeholder="Device"
        [(ngModel)]="id"
        (selectionChange)="load($event.value, true)"
        (click)="startDeviceNavigationHats()"
      >
        <mat-option *ngFor="let deviceSerial of deviceSerialsWithDisplay" [value]="deviceSerial.serial">
          {{ deviceSerial.serialForDisplay }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>

<div [class.loading-mask]="isLoading" [style.display]="(preferenceService?.useLabConsoleUISubject$ | async) ? 'none' : null">
  <div class="page">
    <device-details-summary
      [id]="id"
      (dataLoadedEvent)="closeLoading()"
      [newWindow]="newWindow"
    ></device-details-summary>
  </div>
  <mat-tab-group (selectedTabChange)="startDeviceHistoryHats($event)">
    <mat-tab label="Notes">
      <note-list [id]="id" [noteType]="noteType"></note-list>
    </mat-tab>
    <mat-tab label="History">
      <device-details-history [id]="id"></device-details-history>
    </mat-tab>
    <mat-tab label="Extra Info">
      <device-details-extra-infos *ngIf="data" [extraInfo]="data.extraInfo"></device-details-extra-infos>
    </mat-tab>
  </mat-tab-group>
</div>
