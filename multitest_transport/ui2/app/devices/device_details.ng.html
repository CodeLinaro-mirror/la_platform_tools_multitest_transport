<mat-spinner class="loading-spinner" color="accent" *ngIf="isLoading"></mat-spinner>

<div class="header">
  <div class="back-button-label">Device Details</div>
  <h1 class="subtitle">
    <button
      *ngIf="!isModalMode"
      mat-icon-button
      (click)="back()"
      #backButton
      id="back-button"
      matTooltip="Return"
      aria-label="Return"
    >
      <mat-icon class="back-button-icon">arrow_back</mat-icon>
    </button>
    <mat-form-field fxFlex="300px" appearance="outline" class="mat-select-filter">
      <mat-select
        placeholder="Device"
        [(ngModel)]="id"
        (selectionChange)="load($event.value, true)"
        (click)="startDeviceNavigationHats()"
      >
        <mat-option *ngFor="let deviceSerial of deviceSerialsWithDisplay" [value]="deviceSerial.serial">
          {{ deviceSerial.serialForDisplay }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </h1>
  <div class="action-buttons" *ngIf="appData?.enableLabConsoleUI">
    <div class="lab-console-ui-switch-button">
      <mat-slide-toggle *ngIf="appData?.enableLabConsoleUI" class="lab-console-ui-toggle" [checked]="!(preferenceService?.useLabConsoleUISubject$ | async)" (change)="preferenceService?.useLabConsoleUISubject$.next(!$event.checked)" color="accent">
        Back to Legacy UI
      </mat-slide-toggle>
    </div>
  </div>
</div>

<div [class.loading-mask]="isLoading" [style.display]="(preferenceService?.useLabConsoleUISubject$ | async) ? 'none' : null">
  <div class="page">
    <device-details-summary
      [id]="id"
      (dataLoadedEvent)="closeLoading()"
      [newWindow]="newWindow"
    ></device-details-summary>
  </div>
  <mat-tab-group (selectedTabChange)="startDeviceHistoryHats($event)">
    <mat-tab label="Notes">
      <note-list [id]="id" [noteType]="noteType"></note-list>
    </mat-tab>
    <mat-tab label="History">
      <device-details-history [id]="id"></device-details-history>
    </mat-tab>
    <mat-tab label="Extra Info">
      <device-details-extra-infos [extraInfo]="data?.extraInfo"></device-details-extra-infos>
    </mat-tab>
  </mat-tab-group>
</div>

@if (preferenceService?.useLabConsoleUISubject$ | async) {
  <iframe #iframe srcdoc="" style="width: 100%; height: calc(100% - 120px); border: none;"></iframe>
}
