<mat-toolbar>
  <mat-toolbar-row fxLayoutAlign="space-between center">
    <h1>Builds</h1>
    <button routerLink='/builds/new' mat-flat-button color="accent">
      Create a build
    </button>
  </mat-toolbar-row>
</mat-toolbar>

<mat-spinner class="loading-spinner" color="accent" *ngIf="isLoading"></mat-spinner>

<div class="action-row">
  <button
    mat-stroked-button
    class="delete-button"
    color="accent"
    (click)="deleteSelectedBuilds()"
    [disabled]="this.selection.selected.length === 0"
  >
    Delete
  </button>
</div>

<mat-table
  [dataSource]="dataSource"
  aria-label="Build list">

  <!-- Checkbox column -->
  <ng-container matColumnDef="select">
    <mat-header-cell *matHeaderCellDef fxFlex="76px">
      <mat-checkbox
        (change)="$event ? toggleSelection() : null"
        [checked]="isAllSelected()"
        [indeterminate]="selection.selected.length > 0 && !isAllSelected()"
        aria-label="Select all builds"
        class="select-all-checkbox"
      >
      </mat-checkbox>
    </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex="76px">
      <mat-checkbox
        (click)="$event.stopPropagation()"
        (change)="selection.toggle(build)"
        [checked]="selection.isSelected(build)"
      >
      </mat-checkbox>
    </mat-cell>
  </ng-container>

  <!-- Build name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef fxFlex> Name </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex> {{build.name}} </mat-cell>
  </ng-container>

  <!-- Build fingerprint -->
  <ng-container matColumnDef="fingerprint">
    <mat-header-cell *matHeaderCellDef fxFlex> Fingerprint </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex> {{build.fingerprint}} </mat-cell>
  </ng-container>

  <!-- Build source url -->
  <ng-container matColumnDef="source">
    <mat-header-cell *matHeaderCellDef fxFlex class="build-source-column"> Source </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex class="build-source-column">
      {{build.file_url}}
    </mat-cell>
  </ng-container>

  <!-- Build size -->
  <ng-container matColumnDef="size">
    <mat-header-cell *matHeaderCellDef fxFlex="80px"> Size </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex="80px"> {{build.size | fileSize}} </mat-cell>
  </ng-container>

  <!-- Build labels -->
  <ng-container matColumnDef="labels">
    <mat-header-cell *matHeaderCellDef fxFlex="120px"> Labels </mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex="120px">
      <overflow-list [data]="build.labels || []"
      [overflowListType]="OverflowListType.CHIP">
      </overflow-list>
    </mat-cell>
  </ng-container>

  <!-- Build created date -->
  <ng-container matColumnDef="create_time">
    <mat-header-cell *matHeaderCellDef fxFlex="120px">Created</mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex="120px"
              [title]="build.create_time | utc | date:'MM/dd/yyyy h:mma'">
      {{build.create_time | utc | fromNow}}
    </mat-cell>
  </ng-container>

  <!-- View Build Details Button -->
  <ng-container matColumnDef="view" stickyEnd>
    <mat-header-cell *matHeaderCellDef fxFlex="100px"></mat-header-cell>
    <mat-cell *matCellDef="let build" fxFlex="100px">
      <a mat-stroked-button class="view-button" color="accent" [routerLink]="['/builds', build.id]">
         View
      </a>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>
</mat-table>

<div [class.loading-mask]="!isLoading">
  <div class="empty" *ngIf="!dataSource.data.length">
    No builds found.
  </div>
</div>
