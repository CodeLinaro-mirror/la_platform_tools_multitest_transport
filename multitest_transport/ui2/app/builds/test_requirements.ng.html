<mat-table
  [dataSource]="tableDataSource"
  aria-label="Test requirements">

  <!-- Report type -->
  <ng-container matColumnDef="report_type">
    <mat-header-cell *matHeaderCellDef fxFlex> Test Type </mat-header-cell>
    <mat-cell *matCellDef="let requiredReport" fxFlex> {{requiredReport.type}} </mat-cell>
  </ng-container>

  <!-- Test plan -->
  <ng-container matColumnDef="test_plan">
    <mat-header-cell *matHeaderCellDef fxFlex> Test Plan </mat-header-cell>
    <mat-cell *matCellDef="let requiredReport" fxFlex>
      <mat-select *ngIf="hasTestPlans(requiredReport)"
          [(ngModel)]="getTestRequirementData(requiredReport).selectedTestPlan">
        <mat-option *ngFor="let test_plan of requiredReport.test_plans"
            [value]="test_plan"
            aria-label="Select a test plan">
          {{test_plan}}
        </mat-option>
      </mat-select>
    </mat-cell>
  </ng-container>

  <!-- Test run -->
  <ng-container matColumnDef="test_run">
    <mat-header-cell *matHeaderCellDef fxFlex class="test-run-column"> Test Run </mat-header-cell>
    <mat-cell *matCellDef="let requiredReport" fxFlex class="test-run-column">
      <ng-container *ngIf="requiredReport.test_run_id">
        <a href="/test_runs/{{requiredReport.test_run_id!}}">
          {{requiredReport.test_run_id!}}
        </a>
      </ng-container>
      <ng-container *ngIf="!requiredReport.test_run_id">
        N/A
      </ng-container>
    </mat-cell>
  </ng-container>

  <!-- Test run status -->
  <ng-container matColumnDef="test_run_status">
    <mat-header-cell *matHeaderCellDef fxFlex> Test Run Status </mat-header-cell>
    <mat-cell *matCellDef="let requiredReport" fxFlex>
      <status-button class="xts-requirements-detection"
          *ngIf="requiredReport.test_run_state"
          [state]="requiredReport.test_run_state">
      </status-button>
      <ng-container *ngIf="!requiredReport.test_run_state">
        N/A
      </ng-container>
    </mat-cell>
  </ng-container>

  <!-- Run test button -->
  <ng-container matColumnDef="run_test" stickyEnd>
    <mat-header-cell *matHeaderCellDef fxFlex="100px"></mat-header-cell>
    <mat-cell *matCellDef="let requiredReport" fxFlex="100px">
      <a
          mat-stroked-button
          class="run-button"
          color="accent"
          (click)="openTestRunConfigEditor(requiredReport)">
         Run
      </a>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>
</mat-table>
