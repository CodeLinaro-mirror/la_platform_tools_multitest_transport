<div class="header">
  <div class="back-button-label">Builds</div>
  <h1 class="subtitle">
    <button mat-icon-button (click)="back()" #backButton id="back-button"
      aria-label="Return to builds page"
      matTooltip="Return to builds page">
      <mat-icon class="back-button-icon">arrow_back</mat-icon>
    </button>
    Add A Build
  </h1>
</div>

<div class="page">
  <!-- Name Field -->
  <mat-form-field appearance="outline" [floatLabel]="'always'" fxLayout="column">
    <mat-label> Name </mat-label>
    <input matInput type="text" [(ngModel)]="data.name" name="name" required #name="ngModel"/>
    <mat-error *ngIf="name.invalid && name.touched">Name is required</mat-error>
  </mat-form-field>

  <!-- Fingerprint Field -->
  <mat-form-field appearance="outline" [floatLabel]="'always'" fxLayout="column">
    <mat-label> Fingerprint </mat-label>
    <input matInput type="text"
      [(ngModel)]="data.fingerprint"
      name="fingerprint"
      required
      #fingerprint="ngModel"/>
    <mat-error *ngIf="fingerprint.invalid && fingerprint.touched">
      Fingerprint is required
    </mat-error>
  </mat-form-field>

  <!-- Labels Field -->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-chip-grid #chipList aria-label="Labels">
      <mat-chip-row
        *ngFor="let label of data.labels"
        (removed)="removeLabel(label)">
        {{ label }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
      <input
        placeholder="Labels"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
        [matChipInputAddOnBlur]="true"
        (matChipInputTokenEnd)="addLabel($event)"/>
    </mat-chip-grid>
  </mat-form-field>

  <!-- Source Field -->
  <mat-form-field appearance="outline" class="source-field" floatLabel="always" fxLayout="column"
                  (click)="openBuildFileSelector(data)"
                  (keydown.enter)="openBuildFileSelector(data)">
    <mat-label> Source </mat-label>
    <input matInput type="text" [(ngModel)]="data.file_url" readonly required #url="ngModel">
    <mat-hint>
      {{data.size | fileSize}}
    </mat-hint>
    <mat-error *ngIf="url.invalid && url.touched">
      Source is required
    </mat-error>
  </mat-form-field>

  <div class="buttons">
    <button mat-flat-button class="add-button" color="accent" type="button" aria-label="Add"
        (click)="submit()">
      Add
    </button>
    <button mat-button class="cancel-button" color="accent" type="button" aria-label="Cancel"
        (click)="back()">
      Cancel
    </button>
    <!-- Error messages after validation -->
    <form-error-info [invalidInputs]="invalidInputs"></form-error-info>
  </div>
</div>
