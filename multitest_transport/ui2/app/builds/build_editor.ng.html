<h2 mat-dialog-title>
  Update build
</h2>

<mat-dialog-content>
  <!-- Name Field -->
  <mat-form-field class="name-field" appearance="outline" [floatLabel]="'always'" fxLayout="column">
    <mat-label> Name </mat-label>
    <input matInput type="text" [(ngModel)]="data.build.name" name="name" required #name="ngModel"/>
    <mat-error *ngIf="name.invalid && name.touched">Name is required</mat-error>
  </mat-form-field>

  <!-- Fingerprint Field -->
  <mat-form-field appearance="outline" [floatLabel]="'always'" fxLayout="column">
    <mat-label> Fingerprint </mat-label>
    <input matInput type="text" [(ngModel)]="data.build.fingerprint" disabled readonly required/>
  </mat-form-field>

  <!-- Labels Field -->
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-chip-grid #chipList aria-label="Labels">
      <mat-chip-row
        *ngFor="let label of data.build.labels"
        (removed)="removeLabel(label)">
        {{ label }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
      <input
        placeholder="Labels"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
        [matChipInputAddOnBlur]="true"
        (matChipInputTokenEnd)="addLabel($event)"/>
    </mat-chip-grid>
  </mat-form-field>

  <!-- Source Field -->
  <mat-form-field appearance="outline" class="source-field" floatLabel="always" fxLayout="column">
    <mat-label> Source </mat-label>
    <input matInput type="text" [(ngModel)]="data.build.file_url" disabled readonly required>
    <mat-hint>
      {{data.build.size | fileSize}}
    </mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-flat-button class="update-button" color="accent" type="button" aria-label="Update"
      (click)="updateAndClose()">
      Update
  </button>
  <button mat-button color="accent" mat-dialog-close class="cancel-button">Cancel</button>
  <!-- Error messages after validation -->
  <form-error-info [invalidInputs]="invalidInputs"></form-error-info>
</mat-dialog-actions>
