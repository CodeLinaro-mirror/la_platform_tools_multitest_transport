<mat-spinner class="loading-spinner" color="accent" *ngIf="isLoading"></mat-spinner>

<div class="header">
  <div class="back-button-label">Build Details</div>
  <h1 class="subtitle">
    <button mat-icon-button (click)="back()" #backButton id="back-button"
      matTooltip="Return to builds page"
      aria-label="Return to builds page">
      <mat-icon class="back-button-icon">arrow_back</mat-icon>
    </button>
    Build {{buildId}}
  </h1>
</div>

<div class="page" [class.loading-mask]="isLoading">
  <mat-card class="card">
    <mat-card-title>
      <h2 fxFlex>Metadata</h2>
    </mat-card-title>
    <mat-card-content *ngIf="build">
      <table class="table-layout">
        <tr>
          <td>
            <table class="table-content">
              <tr>
                <td class="title-field">
                  <mat-label>Name</mat-label>
                </td>
                <td class="value-field">
                  {{build.name}}
                </td>
              </tr>
              <tr>
                <td class="title-field">
                  <mat-label>Source</mat-label>
                </td>
                <td class="value-field">{{build.file_url}}</td>
              </tr>
              <tr>
                <td class="title-field">
                  <mat-label>Size</mat-label>
                </td>
                <td class="value-field">{{build.size | fileSize}}</td>
              </tr>
              <tr>
                <td class="title-field">
                  <mat-label>Labels</mat-label>
                </td>
                <td class="value-field">{{build.labels}}</td>
              </tr>
              <tr>
                <td class="title-field">
                  <mat-label>Created</mat-label>
                </td>
                <td class="value-field">{{build.create_time | utc | fromNow}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- TODO: Impletement update and upload functionalities -->
      </table>
    </mat-card-content>
  </mat-card>
  <!-- TODO: Impletement xTS detection Component -->

  <div class="empty" *ngIf="!build && !isLoading">
    Build {{buildId}} not found.
  </div>
</div>
